name: DragonEgg
version: 1.0.0
main: de.larsb6.dragonegg.DragonEggPlugin
api-version: '1.21'
description: Hands the dragon egg to the player with the most damage and locks the End afterwards.
author: larsb6
commands:
  dragonegg:
    description: Manage the DragonEgg plugin.
    usage: /dragonegg <reload|status|top>
    aliases: [degg]
    permission: dragonegg.admin
  endfight:
    description: Show the running endfight timer or end it right away.
    usage: /endfight [skip]
    permission: dragonegg.skip
permissions:
  dragonegg.admin:
    description: Allows /dragonegg reload, status and top.
    default: op
  dragonegg.skip:
    description: Allows /endfight skip.
    default: op
