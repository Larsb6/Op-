name: DragonEgg
version: 1.0.0
main: de.larsb6.dragonegg.DragonEggPlugin
api-version: '1.21'
description: Vergibt das Drachenei an den Spieler mit dem meisten Schaden und sperrt das End danach.
author: larsb6
commands:
  dragonegg:
    description: Verwaltung des DragonEgg-Plugins.
    usage: /dragonegg <reload|status|top>
    aliases: [dragonei, endfight]
    permission: dragonegg.admin
permissions:
  dragonegg.admin:
    description: Erlaubt /dragonegg reload, status und top.
    default: op
