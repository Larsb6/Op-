# ---------------------------------------------------------------------------
#  DragonEgg - Paper 1.21.11
#
#  The Ender Dragon gets extra health, the damage of every player is counted
#  and the player with the most damage receives the dragon egg when the dragon
#  dies. Afterwards ONE single timer runs, which at the same time
#    * locks the End (end-lock)
#    * gives the egg holder glowing (glowing)
#    * shows the ENDFIGHT boss bar (bossbar)
#  The timer starts when the dragon dies and is NEVER reset.
# ---------------------------------------------------------------------------

# Master switch for the whole plugin.
# false = the plugin does nothing: no extra health, no damage counting,
#         no egg reward, no end lock, no glowing, no boss bar and
#         no chat message.
enabled: true

# Duration of the shared timer in seconds (default: 600 = 10 minutes).
# This one timer is used by the end lock, the glowing and the boss bar.
timer:
  duration-seconds: 600

# Extra health for the Ender Dragon.
extra-health:
  enabled: true
  # Multiple of the normal dragon health (200 HP).
  # 10.0 = 2000 HP. The dragon is fully healed when it spawns.
  multiplier: 10.0

# Handing out the dragon egg when the dragon dies.
egg-reward:
  enabled: true
  # Removes the normal dragon egg that vanilla places on the exit portal,
  # so that only a single egg exists.
  remove-portal-egg: true

# Lock of the End after the dragon fight (only leaving on purpose).
# Respawning after death is always allowed, including into the overworld.
end-lock:
  enabled: true

# Glowing for the player who carries the dragon egg in their inventory.
# It only runs for the remaining time of the shared timer.
glowing:
  enabled: true

# Red boss bar that is only shown to players inside the End.
bossbar:
  enabled: true
  # Title of the boss bar. The remaining time is appended as mm:ss.
  title: "ENDFIGHT"
  # Colour of the boss bar: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  color: RED
  # Style of the boss bar: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: SOLID
  # true = show the remaining time in the title ("ENDFIGHT - 09:42")
  show-time: true

# Red chat message for every player as soon as the egg has been handed out.
chat-message:
  enabled: true
  # %player% is replaced with the player name.
  text: "%player% Has got the dragon egg"

# Other texts. Colour codes with & are allowed (for example &c).
messages:
  # Hint for a player who tries to leave the End while it is locked.
  end-locked: "&cThe End stays locked for %time% after the dragon fight."
  # Confirmation for /dragonegg reload
  reloaded: "&aDragonEgg: config.yml reloaded."
  # Header of the damage list of /dragonegg top
  top-header: "&6Damage dealt to the Ender Dragon:"
  # A single line of the damage list
  top-entry: "&e%rank%. &f%player% &7- &c%damage% &7HP"
  # Output when no damage has been counted yet.
  top-empty: "&7No damage has been counted on the dragon yet."
